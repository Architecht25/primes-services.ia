    <noscript>
      <!-- Sans JavaScript, les éléments animés (opacité 0 au départ) restent visibles. -->
      <style>
        [style*="opacity: 0"], [style*="opacity:0"] { opacity: 1 !important; transform: none !important; }
        [style*="translateY(105%)"], [style*="translateY(110%)"] { transform: none !important; }
      </style>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
